[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-assessment"
version = "0.1.0"
description = "Evidence-based verification framework for AI-assisted, authorized web vulnerability assessment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AntiDote" }]
keywords = ["security", "assessment", "osstmm", "verification", "authorized-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
enigma = "enigma.cli:main"

[project.urls]
Homepage = "https://github.com/yoshuaja0301/enigma"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
